<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="hud">
    <span id="roundLabel">Round 1</span>
    <span id="wordLabel"></span>
    <span id="timerLabel"></span>
  </div>

  <div class="toolbar">
    <div id="swatches"></div>
    <button id="brushBtn" class="active">Brush</button>
    <button id="eraserBtn">Eraser</button>
    <label>Size <input type="range" id="sizeSlider" min="2" max="60" value="8"></label>
    <span id="sizePreview"></span>
    <button id="clearBtn">Clear</button>
    <button id="exportBtn">Export PNG</button>
  </div>

  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="960" height="540"></canvas>
    <div id="cursor"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
